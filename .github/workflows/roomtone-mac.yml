name: RoomTone macOS app

# Builds the installable Mac app (.dmg, Apple Silicon + Intel) for RoomTone Studio Designer.
# Run it from the Actions tab ("Run workflow"), or push a tag like roomtone-v1.0.0 to also publish a release.
on:
  workflow_dispatch:
  push:
    branches: [claude/studio-room-design-app-biic5e, main]
    paths: ['studio-designer/**', '.github/workflows/roomtone-mac.yml']
    tags: ['roomtone-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the offline single-file app
        working-directory: studio-designer
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Package the Mac app
        working-directory: studio-designer/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npm run dist
          ls -la release
      - name: Check the app bundle
        working-directory: studio-designer/desktop
        run: |
          APP="release/mac-universal/RoomTone.app"
          test -d "$APP"
          lipo -archs "$APP/Contents/MacOS/RoomTone"
          codesign --verify --deep --verbose=2 "$APP" || echo "::warning::codesign verification reported problems"
          test -f "$APP/Contents/Resources/app.asar"
      - uses: actions/upload-artifact@v4
        with:
          name: RoomTone-mac
          path: |
            studio-designer/desktop/release/*.dmg
            studio-designer/desktop/release/*.zip
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/roomtone-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" studio-designer/desktop/release/*.dmg studio-designer/desktop/release/*.zip --title "RoomTone $GITHUB_REF_NAME" --notes "Installable macOS app (Apple Silicon + Intel). Open the .dmg and drag RoomTone to Applications. First launch: right-click the app and choose Open."

name: RoomTone macOS app

# Builds the installable Mac app (.dmg, Apple Silicon + Intel) for RoomTone Studio Designer.
# Each build also publishes a GitHub Release for the version in studio-designer/desktop/package.json (once per version).
on:
  workflow_dispatch:
  push:
    branches: [claude/studio-room-design-app-biic5e, main]
    paths: ['studio-designer/**', '.github/workflows/roomtone-mac.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the offline single-file app
        working-directory: studio-designer
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Package the Mac app
        working-directory: studio-designer/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npm run dist
          ls -la release
      - name: Check the app bundle
        working-directory: studio-designer/desktop
        run: |
          APP="release/mac-universal/RoomTone.app"
          test -d "$APP"
          lipo -archs "$APP/Contents/MacOS/RoomTone"
          codesign --verify --deep --verbose=2 "$APP" || echo "::warning::codesign verification reported problems"
          test -f "$APP/Contents/Resources/app.asar"
      - uses: actions/upload-artifact@v4
        with:
          name: RoomTone-mac
          path: |
            studio-designer/desktop/release/*.dmg
            studio-designer/desktop/release/*.zip
          if-no-files-found: error
      # Publishes a permanent GitHub Release for the version in desktop/package.json.
      # Runs once per version: bump "version" there to publish a new release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./studio-designer/desktop/package.json').version")
          TAG="roomtone-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skipping (bump the version to publish a new one)."
            exit 0
          fi
          gh release create "$TAG" studio-designer/desktop/release/*.dmg studio-designer/desktop/release/*.zip \
            --target "$GITHUB_SHA" \
            --title "RoomTone Studio Designer $VERSION (macOS)" \
            --notes "Installable macOS app for Apple Silicon and Intel Macs. Download the .dmg, open it and drag RoomTone to Applications. On first launch, right-click the app and choose Open (the app is not notarised by Apple). If macOS reports the app as damaged, run in Terminal - xattr -cr /Applications/RoomTone.app"
